<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog · Zunzhe Zhang</title>
  <meta name="description" content="全部文章与交互图解：按时间轴、分类、系列和标签浏览。">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="Zunzhe Zhang" href="/feed.xml">
  <link rel="stylesheet" href="/assets/site.css?v=98894e8d84a2">
  <link rel="stylesheet" href="/assets/curriculum.css?v=dd0ca17259f8">
  <style>
    .blog-tools { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin: 8px 0 8px; }
    .views { display: inline-flex; gap: 4px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); width: max-content; max-width: 100%; overflow-x: auto; }
    .views button { padding: 5px 14px; border: 0; border-radius: 7px; background: none; color: var(--text-soft); font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .views button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .search { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; font-size: 15px; }
    .search:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .active-filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 0; font-size: 14px; color: var(--text-faint); }
    .active-filters button { padding: 1px 10px; border: 1px solid var(--accent); border-radius: 999px; background: var(--accent-soft); color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; }
    .count { color: var(--text-faint); font-size: 14px; }

    /* timeline */
    .tl { position: relative; margin-top: 24px; padding-left: 26px; }
    .tl::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
    .tl-group { position: relative; margin-bottom: 18px; }
    .tl-group::before { content: ""; position: absolute; left: -26px; top: 7px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .tl-date { margin: 0; font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .tl-date small { margin-left: 8px; font-weight: 400; color: var(--text-faint); }

    .entry { padding: 14px 0; border-bottom: 1px solid var(--border); }
    .entry:last-child { border-bottom: 0; }
    .entry-title { font-weight: 600; font-size: 17px; color: var(--text); }
    .entry-title:hover { color: var(--accent); text-decoration: none; }
    .entry-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 4px; font-size: 13px; color: var(--text-faint); }
    .entry-meta .cat { color: var(--accent); cursor: pointer; }
    .entry-meta .tag { cursor: pointer; }
    .entry-desc { margin: 4px 0 0; color: var(--text-soft); font-size: 15px; line-height: 1.6; }

    .group-title { display: flex; justify-content: space-between; align-items: baseline; margin: 36px 0 4px; font-size: 18px; }
    .group-title .count { font-weight: 400; }
    .series-list { margin: 0; padding-left: 1.6em; }
    .series-list li { padding: 8px 0; border-bottom: 1px solid var(--border); }
    .series-list li::marker { color: var(--text-faint); font-variant-numeric: tabular-nums; }

    .tag-cloud { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-top: 20px; }
    .tag-cloud button { padding: 3px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text); font: inherit; cursor: pointer; line-height: 1.5; }
    .tag-cloud button:hover, .tag-cloud button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
    .tag-cloud sup { margin-left: 3px; color: var(--text-faint); font-size: 11px; }
    .empty { margin-top: 32px; color: var(--text-faint); }
    .tl .entry-meta time { display: none; }
  </style>
</head>
<body>
  <header class="site-header wrap">
    <a class="site-logo" href="/"><span class="dot"></span>Zunzhe Zhang</a>
    <nav class="site-nav">
      <a href="/">Home</a>
      <a href="/papers/">Papers</a>
      <a href="/projects/">Projects</a>
      <a href="/blog/" aria-current="page">Blog</a>
    </nav>
  </header>

  <main class="wrap">
    <header class="post-header">
      <h1>Blog</h1>
      <p class="post-meta">大模型的原理、架构与系统：长文推导、交互图解与工程实践 · <a href="/feed.xml">RSS</a></p>
    </header>

    <div class="blog-tools">
      <div class="views" role="group" aria-label="浏览方式">
        <button type="button" data-view="timeline">时间轴</button>
        <button type="button" data-view="curriculum">学习路径</button>
        <button type="button" data-view="category">分类</button>
        <button type="button" data-view="series">系列</button>
        <button type="button" data-view="tags">标签</button>
      </div>
      <input class="search" type="search" placeholder="搜索标题、简介或标签…" aria-label="搜索">
      <div class="filter-row">
        <div class="filters" role="group" aria-label="按类型筛选">
          <button type="button" data-kind="all">全部</button>
          <button type="button" data-kind="article">文章</button>
          <button type="button" data-kind="interactive">交互</button>
        </div>
        <span class="count" id="count"></span>
      </div>
      <div class="active-filters" id="active"></div>
    </div>

    <div id="list"></div>
    <noscript><p>这个页面需要 JavaScript 来列出文章；也可以订阅 <a href="/feed.xml">RSS</a>。</p></noscript>
  </main>

  <footer class="site-footer wrap">© 2026 Zunzhe Zhang · <a href="/feed.xml">RSS</a></footer>

  <script src="/assets/series.js?v=414d36fec9c5"></script>
  <script src="/assets/posts.js?v=186761fcdc0a"></script>
  <script src="/assets/curriculum.js?v=cbae97d9f5e4"></script>
  <script>
    (() => {
      const { POSTS, CATEGORIES, KINDS } = window.SITE;
      const SERIES = window.SERIES || {};
      const list = document.getElementById('list');
      const search = document.querySelector('.search');
      const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      // State lives in the URL so filtered views can be shared.
      const params = new URLSearchParams(location.search);
      const st = {
        view: params.get('view') || 'timeline',
        kind: params.get('kind') || 'all',
        cat: params.get('cat') || '',
        tag: params.get('tag') || '',
        q: params.get('q') || '',
      };
      if (!['timeline', 'curriculum', 'category', 'series', 'tags'].includes(st.view)) st.view = 'timeline';
      const availableKinds = new Set(POSTS.map(post => post.kind));
      if (!availableKinds.has(st.kind)) st.kind = 'all';
      if (availableKinds.size < 2) document.querySelector('.filters').style.display = 'none';
      search.value = st.q;

      function sync() {
        const p = new URLSearchParams();
        if (st.view !== 'timeline') p.set('view', st.view);
        if (st.kind !== 'all') p.set('kind', st.kind);
        if (st.cat) p.set('cat', st.cat);
        if (st.tag) p.set('tag', st.tag);
        if (st.q) p.set('q', st.q);
        history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p : ''));
      }

      function matches(p) {
        if (st.kind !== 'all' && p.kind !== st.kind) return false;
        if (st.cat && p.cat !== st.cat) return false;
        if (st.tag && !p.tags.includes(st.tag)) return false;
        if (st.q) {
          const hay = (p.title + ' ' + p.desc + ' ' + p.tags.join(' ') + ' ' + CATEGORIES[p.cat]).toLowerCase();
          if (!st.q.toLowerCase().split(/\s+/).every((w) => hay.includes(w))) return false;
        }
        return true;
      }

      function entry(p) {
        const [label, cls] = KINDS[p.kind];
        return '<article class="entry">' +
          '<a class="entry-title" href="/posts/' + p.slug + '/">' + esc(p.title) + '</a>' +
          '<div class="entry-meta"><span class="' + cls + '">' + label + '</span>' +
          '<a class="cat" data-cat="' + p.cat + '">' + esc(CATEGORIES[p.cat]) + '</a>' +
          p.tags.map((t) => '<a class="tag" data-tag="' + esc(t) + '">#' + esc(t) + '</a>').join('') +
          '<time datetime="' + p.date + '">' + p.date + '</time></div>' +
          '<p class="entry-desc">' + esc(p.desc) + '</p></article>';
      }

      function timeline(posts) {
        const groups = new Map();
        posts.forEach((p) => { if (!groups.has(p.date)) groups.set(p.date, []); groups.get(p.date).push(p); });
        return '<div class="tl">' + [...groups].sort((a, b) => (a[0] < b[0] ? 1 : -1)).map(([d, ps]) =>
          '<section class="tl-group"><h2 class="tl-date">' + d + '<small>' + ps.length + ' 篇</small></h2>' + ps.map(entry).join('') + '</section>'
        ).join('') + '</div>';
      }

      function byCategory(posts) {
        return Object.entries(CATEGORIES).map(([k, name]) => {
          const ps = posts.filter((p) => p.cat === k);
          return ps.length ? '<h2 class="group-title">' + esc(name) + '<span class="count">' + ps.length + ' 篇</span></h2>' + ps.map(entry).join('') : '';
        }).join('');
      }

      function bySeries(posts) {
        const ok = new Set(posts.map((p) => p.slug));
        const inSeries = new Set();
        let html = Object.values(SERIES).map((s) => {
          const items = s.posts.filter(([slug]) => ok.has(slug));
          items.forEach(([slug]) => inSeries.add(slug));
          if (!items.length) return '';
          return '<h2 class="group-title">' + esc(s.title) + '<span class="count">' + items.length + ' / ' + s.posts.length + ' 篇</span></h2><ol class="series-list">' +
            items.map(([slug]) => '<li>' + entry(POSTS.find((p) => p.slug === slug) || { slug, title: slug, desc: '', tags: [], kind: 'article', cat: 'basics', date: '' }) + '</li>').join('') + '</ol>';
        }).join('');
        const rest = posts.filter((p) => !inSeries.has(p.slug));
        if (rest.length) html += '<h2 class="group-title">单篇<span class="count">' + rest.length + ' 篇</span></h2>' + rest.map(entry).join('');
        return html;
      }

      function byCurriculum(posts) {
        const ok = new Map(posts.map(p => [p.slug, p]));
        const stages = window.CURRICULUM.stages;
        let html = '<p class="course-intro"><a href="/posts/llm-engineering/">完整学习路径、先修关系与阶段验收 →</a><br>主线按先修关系排列，延伸阅读用于深入各阶段的技术。</p>';
        stages.forEach((s, i) => {
          const core = s.core.filter(slug => ok.has(slug));
          const extra = s.extra.filter(slug => ok.has(slug));
          if (!core.length && !extra.length) return;
          html += '<section class="course-stage"><h2><span>阶段 ' + (i + 1) + '</span>' + esc(s.title) +
            '</h2><p>' + esc(s.goal) + '</p>' + core.map(slug => entry(ok.get(slug))).join('');
          if (extra.length) html += '<details class="course-extras"' + (st.q ? ' open' : '') +
            '><summary>延伸阅读 · ' + extra.length + ' 篇</summary>' + extra.map(slug => entry(ok.get(slug))).join('') + '</details>';
          html += '</section>';
        });
        return html;
      }

      function tagsView(posts) {
        const counts = new Map();
        POSTS.forEach((p) => p.tags.forEach((t) => counts.set(t, (counts.get(t) || 0) + 1)));
        const max = Math.max(...counts.values());
        const cloud = '<div class="tag-cloud">' + [...counts].sort((a, b) => b[1] - a[1]).map(([t, n]) =>
          '<button type="button" data-tag="' + esc(t) + '" aria-pressed="' + (st.tag === t) + '" style="font-size:' + (13 + 7 * (n / max)).toFixed(1) + 'px">' + esc(t) + '<sup>' + n + '</sup></button>').join('') + '</div>';
        return cloud + (st.tag || st.q || st.cat || st.kind !== 'all' ? timeline(posts) : '');
      }

      function render() {
        document.querySelectorAll('.views button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === st.view)));
        document.querySelectorAll('.filters button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.kind === st.kind)));
        const active = [];
        if (st.cat) active.push('<button type="button" data-clear="cat">分类：' + esc(CATEGORIES[st.cat] || st.cat) + ' ×</button>');
        if (st.tag) active.push('<button type="button" data-clear="tag">#' + esc(st.tag) + ' ×</button>');
        document.getElementById('active').innerHTML = active.join('');
        const curriculumSlugs = new Set(window.CURRICULUM.stages.flatMap(s => [...s.core, ...s.extra]));
        const posts = POSTS.filter(p => matches(p) && (st.view !== 'curriculum' || curriculumSlugs.has(p.slug)));
        document.getElementById('count').textContent = posts.length + ' / ' + POSTS.length + ' 篇';
        const views = { timeline, curriculum: byCurriculum, category: byCategory, series: bySeries, tags: tagsView };
        list.innerHTML = posts.length || st.view === 'tags' ? views[st.view](posts) : '<p class="empty">没有符合条件的文章。</p>';
        sync();
      }

      document.querySelector('.views').addEventListener('click', (e) => {
        const b = e.target.closest('button'); if (!b) return; st.view = b.dataset.view; render();
      });
      document.querySelector('.filters').addEventListener('click', (e) => {
        const b = e.target.closest('button'); if (!b) return; st.kind = b.dataset.kind; render();
      });
      search.addEventListener('input', () => { st.q = search.value.trim(); render(); });
      document.getElementById('active').addEventListener('click', (e) => {
        const b = e.target.closest('[data-clear]'); if (!b) return; st[b.dataset.clear] = ''; render();
      });
      list.addEventListener('click', (e) => {
        const c = e.target.closest('[data-cat]');
        const t = e.target.closest('[data-tag]');
        if (c) { e.preventDefault(); st.cat = st.cat === c.dataset.cat ? '' : c.dataset.cat; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        else if (t) { e.preventDefault(); st.tag = st.tag === t.dataset.tag ? '' : t.dataset.tag; render(); if (st.view !== 'tags') window.scrollTo({ top: 0, behavior: 'smooth' }); }
      });
      render();
    })();
  </script>
</body>
</html>
